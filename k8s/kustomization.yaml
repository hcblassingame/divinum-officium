apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: default

commonLabels:
  app: divinum-officium
  managed-by: argocd

resources:
  - deployment.yaml
  - service.yaml
  - ingress.yaml

# The image is mirrored into the cluster's local registry and pinned there.
# Upstream (ghcr.io/divinumofficium/divinum-officium) only keeps the moving
# :master and :nightly tags and deletes old builds, so a GHCR digest pin
# breaks as soon as a pod lands on a node without it cached.
# Updating the build: see "Updating the image" in k8s/README.md.
images:
  - name: ghcr.io/divinumofficium/divinum-officium
    newName: 192.168.10.48:30500/divinum-officium
    newTag: 20261021-242519b   # upstream master built 2026-10-21, commit 242519b

